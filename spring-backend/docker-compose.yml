version: "3.8"

services:
  mysqldb:
    image: mysql:8-oracle
    environment:
      MYSQL_ROOT_PASSWORD: shizadon2005
      MYSQL_DATABASE: hobby
    networks:
      - springmysql-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  spring-backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:3306/hobby?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: shizadon2005
    depends_on:
      mysqldb:
        condition: service_healthy
    networks:
      - springmysql-net

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    volumes:
      - uptime-kuma-data:/app/data
    ports:
      - "3001:3001"
    networks:
      - springmysql-net
    restart: always

networks:
  springmysql-net:

volumes:
  uptime-kuma-data:

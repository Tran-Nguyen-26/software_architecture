# ===== Circuit Breaker =====
resilience4j.circuitbreaker.instances.cloudinaryDelete.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.cloudinaryDelete.sliding-window-size=20
resilience4j.circuitbreaker.instances.cloudinaryDelete.minimum-number-of-calls=10
resilience4j.circuitbreaker.instances.cloudinaryDelete.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.cloudinaryDelete.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.cloudinaryDelete.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.cloudinaryDelete.record-exceptions=java.io.IOException,java.net.SocketTimeoutException,java.util.concurrent.TimeoutException,org.springframework.web.client.ResourceAccessException

# ===== TimeLimiter (tuỳ chọn - chỉ dùng nếu bạn gọi async CompletableFuture) =====
resilience4j.timelimiter.instances.cloudinaryDelete.timeout-duration=3s

# ===== (tuỳ chọn) health indicator để xem trạng thái circuit breaker ở /actuator/health =====
management.health.circuitbreakers.enabled=true
management.endpoints.web.exposure.include=health,info,metrics,circuitbreakers
management.endpoint.health.show-details=always
